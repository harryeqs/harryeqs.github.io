{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Penrose triangle favicon -->
<link rel="icon" href="{{ base_path }}/images/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="{{ base_path }}/images/favicon-32.png" type="image/png" sizes="32x32"/>
<link rel="icon" href="{{ base_path }}/favicon.ico" sizes="48x48"/>
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#fdfbf0" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#474747" media="(prefers-color-scheme: dark)"/>

<!-- EB Garamond font from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet"/>

<!-- end custom head snippets -->
